name: Build Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # Self-signed code signing certificate (see README).
      # Imports the PFX into the current user's store and writes a config
      # overlay with its thumbprint so `tauri build` signs with signtool.
      - name: Import code signing certificate
        id: cert
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE) {
            Write-Output "::warning::WINDOWS_CERTIFICATE secret is not set; building unsigned."
            "config=" >> $env:GITHUB_OUTPUT
            exit 0
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP "cert.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          $cert = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfxPath
          $overlay = @{
            bundle = @{
              windows = @{
                certificateThumbprint = $cert.Thumbprint
                digestAlgorithm       = "sha256"
                timestampUrl          = "http://timestamp.digicert.com"
              }
            }
          } | ConvertTo-Json -Depth 5
          $configPath = Join-Path $env:RUNNER_TEMP "tauri.signing.conf.json"
          Set-Content -Path $configPath -Value $overlay -Encoding utf8
          "config=$configPath" >> $env:GITHUB_OUTPUT

      - name: Build (NSIS + MSI)
        shell: pwsh
        run: |
          $tauriArgs = @("tauri", "build", "--bundles", "nsis,msi")
          if ("${{ steps.cert.outputs.config }}") { $tauriArgs += @("--config", "${{ steps.cert.outputs.config }}") }
          pnpm @tauriArgs

      - uses: actions/upload-artifact@v7
        with:
          name: hello-tauri-windows-x64-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
